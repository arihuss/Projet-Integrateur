services:
  web:
    container_name: tch099-webs
    build:
      context: SiteWebSQAK
      dockerfile: Dockerfile
    ports:
      - "8001:80" # http://localhost:8001
    volumes:
      - ./SiteWebSQAK:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: db_sqak
      MYSQL_USER: db_sqak
      MYSQL_PASSWORD: password
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tch099-network

  db:
    image: mariadb:latest
    command: --default-authentication-plugin=mysql_native_password
    container_name: tch099-db
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: db_sqak
      MYSQL_USER: sqak
      MYSQL_PASSWORD: password
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tch099-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tch099-phpmyadmin
    restart: always
    ports:
      - "8081:80" # Access at http://localhost:8080
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: password
    depends_on:
      - db
    networks:
      - tch099-network

volumes:
  dbdata:

networks:
  tch099-network:
    driver: bridge
